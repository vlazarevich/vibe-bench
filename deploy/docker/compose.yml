# Vibe bench dashboard with PostgreSQL 18, and Caddy for automatic HTTPS under the "https" profile.
#   cp .env.example .env    # set POSTGRES_PASSWORD and VIBE_APP_PASSWORD at least
#   docker compose up -d                     # dashboard on http://127.0.0.1:8080
#   docker compose --profile https up -d     # public HTTPS on VIBE_DOMAIN
name: vibe-bench

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_DB: vibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe']
      interval: 5s
      timeout: 5s
      retries: 30

  dashboard:
    image: ${VIBE_IMAGE:-ghcr.io/vlazarevich/vibe-bench}:${VIBE_VERSION:-latest}
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vibe:${POSTGRES_PASSWORD}@postgres:5432/vibe
      VIBE_APP_PASSWORD: ${VIBE_APP_PASSWORD:?Set VIBE_APP_PASSWORD in .env; the container listens on the network}
      VIBE_PUBLIC_URL: ${VIBE_PUBLIC_URL:-}
      # Caddy's fixed address below; client IPs for login throttling come from its forwarding headers.
      VIBE_TRUSTED_PROXY: ${VIBE_TRUSTED_PROXY:-${VIBE_CADDY_ADDRESS:-172.31.250.10}}
      ARTIFICIAL_ANALYSIS_API_KEY: ${ARTIFICIAL_ANALYSIS_API_KEY:-}
    ports:
      - ${VIBE_BIND_ADDRESS:-127.0.0.1}:${VIBE_HTTP_PORT:-8080}:8080
    networks:
      default:

  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      VIBE_DOMAIN: ${VIBE_DOMAIN:-}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: ${VIBE_CADDY_ADDRESS:-172.31.250.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${VIBE_DOCKER_SUBNET:-172.31.250.0/24}

volumes:
  postgres:
  caddy-data:
  caddy-config:
